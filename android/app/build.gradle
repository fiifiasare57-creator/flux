plugins { id 'com.android.application' }

android {
    namespace 'app.flux'
    compileSdk 34
    defaultConfig {
        applicationId 'app.flux.android'
        minSdk 29            // Android 10+: TLS 1.3 is built in
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'   // QR scanner
    implementation 'androidx.core:core:1.13.1'                      // needed by the scanner (it doesn't bring this itself)
}
