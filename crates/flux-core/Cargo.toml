[package]
name = "flux-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "FLUX core: identity, pairing, secure transport and the file-transfer engine"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "sync"] }
tokio-util = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
url = "2"
dirs = "5"
fs2 = "0.4"
if-addrs = "0.13"
mdns-sd = "0.11"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
