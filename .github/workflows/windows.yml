name: Build FLUX for Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "index.html"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Build FLUX Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # This project is a Cargo workspace: the build output lives in ./target at the repository root.
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build FLUX Windows application
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: flux-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
